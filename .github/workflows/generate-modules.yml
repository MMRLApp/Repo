name: Generate modules.json

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/generate-modules-json.mjs"
      - "json/config.json"
      - ".github/workflows/generate-modules.yml"

permissions:
  contents: write

concurrency:
  group: generate-modules-json
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate modules.json
        env:
          MMRL_API_BASE_URL: ${{ secrets.MMRL_API_BASE_URL }}
          MMRL_API_KEY: ${{ secrets.MMRL_API_KEY }}
          MMRL_OUTPUT_PATH: json/modules.json
          MMRL_META_PATH: json/config.json
        run: node scripts/generate-modules-json.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- json/modules.json; then
            echo "No changes to modules.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add json/modules.json
          git commit -m "chore: regenerate modules.json [skip ci]"
          git push
